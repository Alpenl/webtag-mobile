name: release
run-name: release / ${{ github.ref_name }}

# 打 tag 时构建、签名并发布 APK。
#
# 这是仓库里唯一允许读签名凭据的 workflow。日常那条 android.yml 快速门禁被
# scripts/mobile-x1-check.py 强制禁止出现 `secrets.`、`environment:` 与
# assembleRelease，所以普通 PR 既不需要、也无法接触发布密钥——包括来自 fork 的 PR。
#
# 签名刻意不写进 android/app/build.gradle.kts：同一个 X1 门禁禁止提交 `signingConfigs`，
# 保证仓库里永远不出现密钥路径或口令字段。因此 Gradle 只产出未签名 APK，签名由下面的
# apksigner 步骤在 CI 内完成。
#
# workflow_dispatch 在普通分支上跑是「演练」：构建 + 签名 + 校验，但不发布。
# 只有 tag 才会创建 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # 创建 Release 需要写权限；只有这个 job 有，其余 workflow 一律只读。
      contents: write
    steps:
      # 密钥缺失要在花任何时间之前就失败，而且必须失败——不能退化成发一个 debug
      # 签名的包，那种「成功」比失败更糟：它看起来是正式产物。
      - name: 校验签名凭据齐全
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64}" ] || missing="${missing} ANDROID_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD}" ] || missing="${missing} ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS}" ] || missing="${missing} ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD}" ] || missing="${missing} ANDROID_KEY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::缺少签名 secret：${missing}。在 Settings → Secrets and variables → Actions 添加后重试。"
            exit 1
          fi
          echo "四个签名 secret 均已配置。"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # tag 与 versionName 必须一致。不一致就发布，会得到一个文件名写着 v0.2.0、
      # 内部 versionName 仍是 0.1.0 的包——设备按后者判断升级，用户永远装不上新版。
      - name: 核对 tag 与 versionName
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]\{1,\}\).*/\1/p' android/app/build.gradle.kts)"
          if [ -z "${VERSION_NAME}" ] || [ -z "${VERSION_CODE}" ]; then
            echo "::error::未能从 android/app/build.gradle.kts 读出 versionName / versionCode"
            exit 1
          fi
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 versionName ${VERSION_NAME} 不一致，应为 v${VERSION_NAME}"
            exit 1
          fi
          printf 'name=%s\n' "${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          printf 'code=%s\n' "${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      # 发布前跑与 android.yml 完全相同的门禁。发布是最不该「这次先跳过验证」的场合。
      - name: Validate shared fixtures
        run: |
          python3 shared/fixtures/validate.py
          python3 shared/fixtures/compare.py

      - name: Run Mobile static and wire gates
        run: |
          python3 scripts/mobile-x1-check.py
          python3 scripts/mobile-wire-smoke.py

      - name: Run Android gates
        run: ./android/gradlew -p android --no-daemon --dependency-verification strict testDebugUnitTest lintDebug

      - name: Build unsigned release APK
        run: ./android/gradlew -p android --no-daemon --dependency-verification strict assembleRelease

      # keystore 落在 RUNNER_TEMP 而不是 workspace：workspace 会被后续步骤扫描和上传，
      # 密钥不该有任何机会混进产物。
      - name: 签名并校验 APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/signing.jks"
          trap 'shred -u "${KEYSTORE}" 2>/dev/null || rm -f "${KEYSTORE}"' EXIT

          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: ${BUILD_TOOLS}"

          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "${UNSIGNED}"
          mkdir -p dist
          OUT="dist/webtag-share-v${VERSION_NAME}.apk"

          # zipalign 必须在签名之前：签名后再对齐会破坏 v2/v3 签名块。
          "${BUILD_TOOLS}/zipalign" -p -f 4 "${UNSIGNED}" "${RUNNER_TEMP}/aligned.apk"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --out "${OUT}" \
            "${RUNNER_TEMP}/aligned.apk"

          # apksigner verify 失败会返回非零；额外断言 v2 方案确实生效
          # （minSdk 26 下 v1/JAR 签名会被自动跳过，属正常）。
          "${BUILD_TOOLS}/apksigner" verify --print-certs --verbose "${OUT}" | tee "${RUNNER_TEMP}/verify.txt"
          grep -q "APK Signature Scheme v2): true" "${RUNNER_TEMP}/verify.txt"

          # 指纹行的前缀随 build-tools 版本变化：35 打印 "Signer #1 certificate ..."，
          # 37 打印 "V3.0 Signer: certificate ..."。只锚定稳定的那一段，否则升级
          # runner 镜像就会让发布在最后一步炸掉——这条已经真的发生过一次。
          CERT_SHA256="$(sed -n 's/.*certificate SHA-256 digest: *\([0-9a-f]\{64\}\).*/\1/p' \
            "${RUNNER_TEMP}/verify.txt" | sort -u)"
          if [ "$(printf '%s\n' "${CERT_SHA256}" | grep -c .)" != "1" ]; then
            echo "::error::期望恰好一个签名证书指纹，实际读到：${CERT_SHA256:-<空>}"
            exit 1
          fi

          # APK 确实由预期的那把密钥签名，而不是「某把」密钥。换错 secret 是真实的
          # 失败模式，而它签出来的包一样能通过 apksigner verify。
          EXPECTED_SHA256="$(keytool -list -v -keystore "${KEYSTORE}" \
            -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" 2>/dev/null \
            | awk '/^[[:space:]]*SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          if [ -z "${EXPECTED_SHA256}" ]; then
            echo "::error::未能从 keystore 读出预期指纹"
            exit 1
          fi
          if [ "${CERT_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::APK 的签名身份与 keystore 不符：APK=${CERT_SHA256} keystore=${EXPECTED_SHA256}"
            exit 1
          fi
          echo "签名身份已核对：${CERT_SHA256}"
          printf 'cert=%s\n' "${CERT_SHA256}" >> "$GITHUB_OUTPUT"

          ( cd dist && sha256sum ./*.apk > SHA256SUMS )
          cat dist/SHA256SUMS

      # 密钥泄漏的最后一道拦截。
      - name: 确认产物中没有密钥文件
        run: |
          set -euo pipefail
          if find dist -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' \) | grep -q .; then
            echo "::error::产物目录中出现了密钥文件"
            exit 1
          fi
          if [ -e "${RUNNER_TEMP}/signing.jks" ]; then
            echo "::error::签名密钥未被清除"
            exit 1
          fi
          echo "产物干净，签名密钥已清除。"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: webtag-share-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: 生成 Release 说明
        if: github.ref_type == 'tag'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CERT_SHA256: ${{ steps.sign.outputs.cert }}
        run: |
          set -euo pipefail
          {
            printf 'WebTag Share Android `v%s`（versionCode %s）\n\n' "${VERSION_NAME}" "${VERSION_CODE}"
            printf '下载 `webtag-share-v%s.apk` 侧载安装。\n\n' "${VERSION_NAME}"
            printf '**校验完整性**\n\n```bash\nsha256sum -c SHA256SUMS\n```\n\n'
            printf '**校验签名身份**——升级时这个指纹必须不变，变了说明包不是同一把密钥签的：\n\n'
            printf '```\n%s\n```\n\n' "${CERT_SHA256}"
            printf '```bash\napksigner verify --print-certs webtag-share-v%s.apk\n```\n' "${VERSION_NAME}"
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: 发布 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/*.apk dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WebTag Share ${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md"

name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xctest:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Validate shared fixtures
        run: |
          python3 shared/fixtures/validate.py
          python3 shared/fixtures/compare.py

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          preferred = []
          fallback = []
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for entry in entries:
                  if not entry.get("isAvailable") or not entry.get("name", "").startswith("iPhone"):
                      continue
                  fallback.append(entry["udid"])
                  if entry["name"] in {"iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro"}:
                      preferred.append(entry["udid"])
          values = preferred or fallback
          if not values:
              raise SystemExit("no available iPhone simulator")
          print(values[0])
          ' )"
          echo "id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"
          echo "Using simulator ${DEVICE_ID}"

      - name: Build iOS tests
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/WebTagShare.xcodeproj \
            -scheme WebTagShare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/WebTagDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Run iOS unit tests
        id: unit_tests
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/WebTagShare.xcodeproj \
            -scheme WebTagShare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/WebTagDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/WebTagUnitTests.xcresult" \
            -only-testing:WebTagShareTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building | tee -a "$RUNNER_TEMP/xcodebuild.log"

      - name: Report unit-test results
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/WebTagUnitTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/WebTagUnitTests.xcresult" \
              --format json | tee "$RUNNER_TEMP/unit-test-summary.json"
            xcrun xcresulttool get test-results tests \
              --path "$RUNNER_TEMP/WebTagUnitTests.xcresult" \
              --format json | tee "$RUNNER_TEMP/unit-test-results.json"
          fi

      - name: Run iOS UI tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/WebTagShare.xcodeproj \
            -scheme WebTagShare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/WebTagDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/WebTagUITests.xcresult" \
            -only-testing:WebTagShareUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building | tee -a "$RUNNER_TEMP/xcodebuild.log"

      - name: Report UI-test results
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/WebTagUITests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/WebTagUITests.xcresult" \
              --format json | tee "$RUNNER_TEMP/ui-test-summary.json"
            xcrun xcresulttool get test-results tests \
              --path "$RUNNER_TEMP/WebTagUITests.xcresult" \
              --format json | tee "$RUNNER_TEMP/ui-test-results.json"
          fi

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: webtag-ios-xctest
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/*-test-*.json
            ${{ runner.temp }}/WebTagUnitTests.xcresult
            ${{ runner.temp }}/WebTagUITests.xcresult
          if-no-files-found: warn
          retention-days: 7

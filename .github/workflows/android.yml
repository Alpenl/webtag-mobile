name: android

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "shared/**"
      - "scripts/mobile-x1-check.py"
      - "scripts/mobile-wire-smoke.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-device.yml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate shared fixtures
        run: |
          python3 shared/fixtures/validate.py
          python3 shared/fixtures/compare.py

      - name: Run Mobile static and wire gates
        run: |
          python3 scripts/mobile-x1-check.py
          python3 scripts/mobile-wire-smoke.py

      - name: Verify Android dependency metadata
        working-directory: android
        run: ./gradlew --no-daemon --dependency-verification strict help

      - name: Run Android fast build gates
        run: ./android/gradlew -p android --no-daemon --dependency-verification strict testDebugUnitTest assembleDebug lintDebug

      - name: Check whitespace and signing files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e android/local.properties
          ! rg --files . -g '*.p12' -g '*.mobileprovision' -g '*.jks' -g '*.keystore'

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: webtag-share-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
